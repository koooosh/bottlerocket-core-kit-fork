name: "Update eni-max-pods.txt"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
permissions:
  id-token: write
  contents: write
  pull-requests: write
jobs:
  update-max-pods:
    if: github.repository == 'koooosh/bottlerocket-core-kit-fork'
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # 4.3.1
        with:
          aws-region: ${{ secrets.ENI_MAX_PODS_UPDATER_REGION }}
          role-to-assume: ${{ secrets.ENI_MAX_PODS_UPDATER_ROLE_ARN }}
          
      - name: Checkout repositories
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # 5.0.0
        with:
          repository: koooosh/bottlerocket-core-kit-fork
          ref: refs/heads/develop
          path: bottlerocket-core-kit-fork/
          
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # 5.0.0
        with:
          repository: aws/amazon-vpc-cni-k8s
          ref: refs/heads/master
          path: amazon-vpc-cni-k8s/
          
      - name: Generate and copy limits
        run: |
          cd amazon-vpc-cni-k8s/
          make generate-limits
          cp misc/eni-max-pods.txt ../bottlerocket-core-kit-fork/packages/os/eni-max-pods

          
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # 7.0.8
        with:
          branch: update-eni-max-pods
          path: bottlerocket-core-kit-fork/
          base: develop
          add-paths: |
            packages/os/eni-max-pods
          commit-message: "Update eni-max-pods.txt"
          committer: "GitHub <noreply@github.com>"
          author: "GitHub <noreply@github.com>"
          labels: |
            changelog/exclude
          title: "Update eni-max-pods.txt"
          body: |
            Generated by [aws/amazon-vpc-cni-k8s](https://github.com/aws/amazon-vpc-cni-k8s):
            ```
            make generate-limits
            ```
